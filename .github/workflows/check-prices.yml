name: فحص أسعار أمازون

on:
  schedule:
    - cron: "0 */6 * * *"   # كل 6 ساعات
  workflow_dispatch:         # تشغيل يدوي

permissions:
  contents: write            # لحفظ prices_history.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: فحص الأسعار
        run: python check_prices.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_CHANGE_PCT: "1"   # تجاهل التغيّر الأقل من 1%

      - name: حفظ سجل الأسعار
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices_history.json
          git diff --staged --quiet || (git commit -m "update prices" && git push)
