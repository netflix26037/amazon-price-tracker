name: فحص أسعار أمازون

on:
  schedule:
    # يشتغل كل 6 ساعات (التوقيت بتوقيت UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # يسمح بتشغيله يدويًا من تبويب Actions

permissions:
  contents: write

# يمنع تشغيل نسختين بنفس الوقت؛ التشغيل الثاني ينتظر الأول بدل ما يتعارض معه
concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    # حد أقصى أقل من حد GitHub (6 ساعات) عشان خطوة حفظ السجل دايمًا تلحق تشتغل
    timeout-minutes: 350
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل فحص الأسعار
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ميزانية وقت السكربت: 5 ساعات و10 دقائق (أقل من timeout أعلاه)
          MAX_RUNTIME_SECONDS: "18600"
        run: python check_prices.py

      # always(): يحفظ السجل حتى لو السكربت انقطع أو فشل -- وإلا يضيع التقدم
      # ويرجع يعيد نفس المنتجات (وهذا كان سبب التكرار)
      - name: حفظ سجل الأسعار المحدث
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices_history.json

          if git diff --staged --quiet; then
            echo "لا يوجد تغيير في سجل الأسعار."
            exit 0
          fi

          git commit -m "تحديث سجل الأسعار"

          # نسحب آخر تحديثات الفرع قبل الدفع (لأنك ترفع products.json بين الحين
          # والآخر)، ونعيد المحاولة لو تعارض.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push && break
            echo "محاولة الدفع رقم $i فشلت، إعادة المحاولة..."
            sleep 5
          done
