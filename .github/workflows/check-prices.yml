name: فحص أسعار أمازون

on:
  schedule:
    # يشتغل كل 6 ساعات (التوقيت بتوقيت UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # يسمح بتشغيله يدويًا من تبويب Actions

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    strategy:
      # 6 دفعات تشتغل بالتوازي، كل دفعة تاخذ سدس المنتجات تقريبًا
      # (2334 منتج / 6 ≈ 389 منتج لكل دفعة ≈ 97 دقيقة تشغيل -- هامش أمان
      # كبير عن حد الـ 6 ساعات المسموح به لكل Job).
      # لو زاد عدد المنتجات كثير بالمستقبل، زود رقم هنا وفي BATCH_COUNT
      # بالأسفل بنفس القيمة (مثلاً لو صار عندك 4000 منتج، خليها 10).
      matrix:
        batch: [0, 1, 2, 3, 4, 5]
      fail-fast: false  # لو دفعة وحدة فشلت، الباقي يكمل عادي

    # كل دفعة لها مجموعة تزامن مستقلة، عشان الدفعات تشتغل بالتوازي فعليًا
    # (لو كل الدفعات بنفس المجموعة، بيصطفوا وراء بعض وترجع نفس مشكلة الوقت)
    concurrency:
      group: price-check-batch-${{ matrix.batch }}
      cancel-in-progress: false

    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل فحص الأسعار (دفعة ${{ matrix.batch }})
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BATCH_INDEX: ${{ matrix.batch }}
          BATCH_COUNT: 6
        run: python check_prices.py

      - name: حفظ سجل الأسعار المحدث لهذه الدفعة
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices_history_batch${{ matrix.batch }}.json

          # لو ما فيه تغيير فعلي، ما فيه داعي نكمل
          if git diff --staged --quiet; then
            echo "لا يوجد تغيير في سجل الأسعار لهذه الدفعة."
            exit 0
          fi

          git commit -m "تحديث سجل الأسعار (دفعة ${{ matrix.batch }})"

          # كل دفعة تلمس ملف مختلف عن باقي الدفعات، فاحتمال التعارض
          # ضعيف جدًا، لكن نحتفظ بإعادة المحاولة احتياطًا لو صار تزامن
          # مع دفعة ثانية أو رفعة يدوية لـ products.json بنفس الوقت.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push && break
            echo "محاولة الدفع رقم $i فشلت، إعادة المحاولة..."
            sleep $((RANDOM % 20 + 5))
          done
